services:
  app:
    build: .
    container_name: gestao-funcionarios
    ports:
      - "8080:80"
    # Monta o código como volume: qualquer alteração nos arquivos
    # aparece no navegador apenas recarregando a página (modo desenvolvimento).
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
